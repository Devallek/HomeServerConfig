services:
  youtrack:
    container_name: YT_YouTrack
    image: jetbrains/youtrack:2026.2.16593
    ports:
      - 8080:8080
    volumes:
      - yt_data:/opt/youtrack/data
      - yt_conf:/opt/youtrack/conf
      - yt_logs:/opt/youtrack/logs
      - yt_backups:/opt/youtrack/backups
    restart: unless-stopped

volumes:
  yt_data:
  yt_conf:
  yt_logs:
  yt_backups:
